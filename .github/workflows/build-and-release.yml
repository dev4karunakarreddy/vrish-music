name: Build & Release Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0 or latest)'
        required: false
        default: 'latest'
        type: string
      release_title:
        description: 'Release Title'
        required: false
        default: 'Vrish Music Release'
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm Store Directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Export Expo Android Bundle
        run: pnpm export:android

      - name: Build Android Release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Release APK Asset
        id: apk_meta
        shell: bash
        run: |
          APK_SRC="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Error: Release APK not found at $APK_SRC"
            exit 1
          fi

          VERSION="latest"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag_name }}" ]]; then
            VERSION="${{ inputs.tag_name }}"
          fi

          FINAL_APK_NAME="Vrish-Music-${VERSION}.apk"
          OUTPUT_DIR="build-output"
          mkdir -p "$OUTPUT_DIR"
          cp "$APK_SRC" "$OUTPUT_DIR/$FINAL_APK_NAME"

          echo "apk_path=$OUTPUT_DIR/$FINAL_APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$FINAL_APK_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Prepared $FINAL_APK_NAME ($(du -h "$OUTPUT_DIR/$FINAL_APK_NAME" | cut -f1))"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_meta.outputs.apk_name }}
          path: ${{ steps.apk_meta.outputs.apk_path }}
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.tag_name != '' && inputs.tag_name || 'latest') }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Vrish Music {0}', github.ref_name) || (inputs.release_title != '' && inputs.release_title || 'Vrish Music Latest Build') }}
          files: ${{ steps.apk_meta.outputs.apk_path }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          body: |
            ## Vrish Music Player (${{ steps.apk_meta.outputs.version }})

            Automated production build generated by GitHub Actions.

            - **Commit**: `${{ github.sha }}`
            - **Branch / Tag**: `${{ github.ref_name }}`
            - **File**: `${{ steps.apk_meta.outputs.apk_name }}`

            ### Features:
            - Minimalist monochrome design
            - Zero-hang performance & GSAP animated splash screen
            - Direct storage streaming & automatic Downloads folder background sync
            - Offline audio player with embedded SQLite metadata cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
